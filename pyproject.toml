[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pumpkinpi"
version = "0.1.0"
description = "Installable CLI for the RemoteRPi PumpkinPi scripts."
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Jordan Driscoll", email = "drisjor@proton.me" }]
license = { text = "MIT" }
dependencies = [
    "gpiozero>=2.0",
]

[project.scripts]
pumpkinpi = "PumpkinPi.cli:main"

[tool.setuptools]
packages = ["PumpkinPi"]
